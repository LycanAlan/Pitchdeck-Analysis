# Render blueprint. Deploy with: New > Blueprint > point at this repo.
#
# The API is the only public service. Streamlit is optional and costs a second
# instance, so it is commented out by default -- the FastAPI docs page at /docs
# is a perfectly good demo surface on its own.

services:
  - type: web
    name: pitchlens-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Measured at 298 MB resident with the index and both ONNX models loaded,
    # against the free tier's 512 MB. It only fits because embedding and
    # re-ranking run on ONNX Runtime instead of PyTorch; the torch build measured
    # 523 MB and would have been OOM-killed here.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # set this in the Render dashboard, never in git
      # The free instance is 0.1 CPU. Letting ONNX spawn a thread per core makes
      # it thrash rather than go faster.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

